[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==3.16.2",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-ai==2.46.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "tiktoken==0.14.0",
    "uvicorn==0.53.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.pytest.ini_options]
# `ingest` is a top-level package next to `app` but not part of the installed wheel.
pythonpath = ["."]
testpaths = ["tests"]
# The fast suite stays offline; run live tests with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require live Supabase and OpenAI credentials",
]

[dependency-groups]
dev = [
    "docling==2.129.0",
    "ipykernel==7.3.0",
    "pytest==9.1.1",
    "ruff==0.16.8",
]
